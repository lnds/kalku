[tool.commitizen]
name = "cz_conventional_commits"
version = "0.10.0"
version_files = ["VERSION", "kai.toml:^version", "kalku/version.kai:VERSION", "adapters/elixir/mix.exs:@version", "adapters/rust/Cargo.toml:^version", "adapters/python/pyproject.toml:^version", "adapters/python/src/kalku_python/__init__.py:__version__", "adapters/java/pom.xml:^  <version>"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
major_version_zero = true

# Keep-a-Changelog section names for the Conventional-Commits types that
# reach the changelog; docs, chore, ci, test, and build stay out of it.
change_type_map = { "feat" = "Added", "fix" = "Fixed", "perf" = "Changed", "refactor" = "Changed" }
change_type_order = ["BREAKING CHANGE", "Added", "Fixed", "Changed", "Removed"]
