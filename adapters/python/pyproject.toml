[project]
name = "kalku-python"
version = "0.13.0"
description = "The Python kalku: finds the places where a defect can be cast in a Python project, and casts them"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kalku-python = "kalku_python.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The fixtures are the input of the tests, written the way they are on purpose.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
