name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      elixir: ${{ steps.filter.outputs.elixir }}
      elixir_project: ${{ steps.project.outputs.elixir_project }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_project: ${{ steps.project.outputs.rust_project }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            elixir:
              - '{adapters/elixir/**,docs/protocol/fixtures/**}'
            rust:
              - '{adapters/rust/**,docs/protocol/fixtures/**}'
      - id: project
        run: |
          echo "elixir_project=$([ -f adapters/elixir/mix.exs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust_project=$([ -f adapters/rust/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Format, lint and the quality gate: seconds of work, in a job of their
  # own so a slip in any of them is a red cross in a minute rather than
  # one reported from behind a quarter hour of tests.
  kaikai-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kaikai
      - run: make fmt-check lint km

  kaikai-side:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kaikai
      - run: make build test-kaikai

  elixir-kalku:
    needs: changes
    if: needs.changes.outputs.elixir == 'true' && needs.changes.outputs.elixir_project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/elixir
    steps:
      - uses: actions/checkout@v4
      # The oldest supported versions: the built-in JSON module needs Elixir 1.18.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - run: mix format --check-formatted
      - run: mix test

  # The Rust kalku measures the 2024 edition, which needs Rust 1.85, so that
  # is the oldest toolchain it is tested on, beside the current stable. The
  # formatter and the linter run once, on stable: their opinions change
  # between releases and the toolchain under test is not what they judge.
  rust-kalku:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_project == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85', stable]
    defaults:
      run:
        working-directory: adapters/rust
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy --component llvm-tools
          rustup default ${{ matrix.toolchain }}
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The one required check: green when every job that ran passed or was skipped.
  ci-ok:
    if: always()
    needs: [changes, kaikai-checks, kaikai-side, elixir-kalku, rust-kalku]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.kaikai-checks.result }}" "${{ needs.kaikai-side.result }}" "${{ needs.elixir-kalku.result }}" "${{ needs.rust-kalku.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended in: $r"; exit 1 ;; esac
          done
