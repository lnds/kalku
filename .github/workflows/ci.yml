name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      elixir: ${{ steps.filter.outputs.elixir }}
      elixir_project: ${{ steps.project.outputs.elixir_project }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            elixir:
              - '{adapters/elixir/**,docs/protocol/fixtures/**}'
      - id: project
        run: echo "elixir_project=$([ -f adapters/elixir/mix.exs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  kaikai-side:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kaikai (pinned)
        run: |
          v="$(cat .kaikai-version)"
          curl -fsSL https://raw.githubusercontent.com/kaikailang-org/kaikai/main/install.sh \
            | KAIKAI_DIST_BASE="https://github.com/kaikailang-org/kaikai/releases/download/v$v" sh
          echo "$HOME/.kaikai/bin" >> "$GITHUB_PATH"

      - name: Install km
        run: |
          curl -fsSL https://github.com/lnds/kimun/releases/download/v0.25.0/km-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin km

      - name: Check toolchain
        run: kai --version && km --version

      - run: make ci

  elixir-kalku:
    needs: changes
    if: needs.changes.outputs.elixir == 'true' && needs.changes.outputs.elixir_project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: adapters/elixir/.tool-versions
          version-type: strict
      - run: mix format --check-formatted
      - run: mix test

  # The one required check: green when every job that ran passed or was skipped.
  ci-ok:
    if: always()
    needs: [changes, kaikai-side, elixir-kalku]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.kaikai-side.result }}" "${{ needs.elixir-kalku.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended in: $r"; exit 1 ;; esac
          done
