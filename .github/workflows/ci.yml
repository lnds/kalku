name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      elixir: ${{ steps.filter.outputs.elixir }}
      elixir_project: ${{ steps.project.outputs.elixir_project }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_project: ${{ steps.project.outputs.rust_project }}
      python: ${{ steps.filter.outputs.python }}
      python_project: ${{ steps.project.outputs.python_project }}
      java: ${{ steps.filter.outputs.java }}
      java_project: ${{ steps.project.outputs.java_project }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            elixir:
              - '{adapters/elixir/**,docs/protocol/fixtures/**}'
            rust:
              - '{adapters/rust/**,docs/protocol/fixtures/**}'
            python:
              - '{adapters/python/**,docs/protocol/fixtures/**}'
            java:
              - '{adapters/java/**,docs/protocol/fixtures/**,Makefile}'
      - id: project
        run: |
          echo "elixir_project=$([ -f adapters/elixir/mix.exs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust_project=$([ -f adapters/rust/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python_project=$([ -f adapters/python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "java_project=$([ -f adapters/java/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Format, lint and the quality gate: seconds of work, in a job of their
  # own so a slip in any of them is a red cross in a minute rather than
  # one reported from behind a quarter hour of tests.
  kaikai-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kaikai
      - run: make fmt-check lint km

  kaikai-side:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kaikai
      - run: make build test-kaikai

  elixir-kalku:
    needs: changes
    if: needs.changes.outputs.elixir == 'true' && needs.changes.outputs.elixir_project == 'true'
    runs-on: ubuntu-latest
    # The oldest supported versions, and the oldest with a JSON module of its
    # own, which the suite holds the kalku's codec against. The formatter runs
    # once: its opinions change between releases and the version under test is
    # not what it judges.
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.16'
            otp: '26'
          - elixir: '1.18'
            otp: '27'
            format: true
    defaults:
      run:
        working-directory: adapters/elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - if: matrix.format
        run: mix format --check-formatted
      # One fixture has a dependency rebar3 builds.
      - run: mix local.rebar --force
      - run: mix test

  # The Rust kalku measures the 2024 edition, which needs Rust 1.85, so that
  # is the oldest toolchain it is tested on, beside the current stable. The
  # formatter and the linter run once, on stable: their opinions change
  # between releases and the toolchain under test is not what they judge.
  rust-kalku:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_project == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85', stable]
    defaults:
      run:
        working-directory: adapters/rust
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy --component llvm-tools
          rustup default ${{ matrix.toolchain }}
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Python kalku runs inside the interpreter of the project it measures, so
  # it is held to the oldest Python it supports and the newest. The formatter
  # and the linter run once, on the newest: their opinions change between
  # releases.
  python-kalku:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.python_project == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: adapters/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - if: matrix.python == '3.13'
        run: ruff format --check . && ruff check .
      - run: python -m pytest -q

  # The Java kalku runs on the JDK of the project it measures and reads sources
  # with that JDK's own compiler, so it is held to every long-term release
  # from the oldest it supports to the newest: what a new JDK changes shows up
  # here, in the goldens, before it shows up in someone's project.
  java-kalku:
    needs: changes
    if: needs.changes.outputs.java == 'true' && needs.changes.outputs.java_project == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21', '25']
    defaults:
      run:
        working-directory: adapters/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The runner's Gradle needs Java 17, and a test of a Gradle build is passed over where
      # Gradle does not run. On Java 11 one that does is fetched, held to its checksum, and
      # named to the kalku.
      - name: A Gradle that runs on Java 11
        if: matrix.java == '11'
        env:
          GRADLE: gradle-8.14.3
          SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          curl -fsSLo "$RUNNER_TEMP/$GRADLE.zip" "https://services.gradle.org/distributions/$GRADLE-bin.zip"
          echo "$SHA256  $RUNNER_TEMP/$GRADLE.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$GRADLE.zip" -d "$RUNNER_TEMP"
          echo "KALKU_GRADLE=$RUNNER_TEMP/$GRADLE/bin/gradle" >> "$GITHUB_ENV"
      - run: mvn -B -q verify
      # What a release ships is one file, the summoning script with the jar behind it. It has
      # to start on every JDK the kalku runs on.
      - name: The shipped file answers
        working-directory: .
        run: |
          make adapters/java/dist/kalku-java
          printf '{"type":"shutdown","id":1}\n' | adapters/java/dist/kalku-java | grep -q '"type":"bye"'

  # The one required check: green when every job that ran passed or was skipped.
  ci-ok:
    if: always()
    needs: [changes, kaikai-checks, kaikai-side, elixir-kalku, rust-kalku, python-kalku, java-kalku]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.kaikai-checks.result }}" "${{ needs.kaikai-side.result }}" "${{ needs.elixir-kalku.result }}" "${{ needs.rust-kalku.result }}" "${{ needs.python-kalku.result }}" "${{ needs.java-kalku.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended in: $r"; exit 1 ;; esac
          done
